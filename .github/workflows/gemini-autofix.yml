name: Gemini Autofix

on:
  pull_request:
    types: [labeled]

concurrency:
  group: gemini-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gemini-autofix:
    name: AI Autofix
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: github.event.label.name == 'gemini:autofix'

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Verificar rama/PR de autofix existente
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTOFIX_BRANCH="gemini-autofix/${{ github.event.pull_request.head.ref }}"
          echo "name=$AUTOFIX_BRANCH" >> "$GITHUB_OUTPUT"

          EXISTING_PR_URL=$(gh pr list --head "$AUTOFIX_BRANCH" --base "${{ github.event.pull_request.head.ref }}" --json url --jq '.[0].url')

          if [[ -n "$EXISTING_PR_URL" ]]; then
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
            echo "existing_pr_url=$EXISTING_PR_URL" >> "$GITHUB_OUTPUT"
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
            # Si la rama quedo huerfana de una corrida anterior sin PR asociado
            # (ya confirmamos arriba que no hay PR abierto para ella), la borramos
            # antes de recrearla - si no, el push de abajo rebota (non-fast-forward).
            git push origin --delete "$AUTOFIX_BRANCH" 2>/dev/null || true
            git checkout -b "$AUTOFIX_BRANCH"
            git push origin "$AUTOFIX_BRANCH"
          fi

      - name: Avisar que ya existe un PR de autofix
        if: steps.branch.outputs.already_exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "ℹ️ **Gemini Autofix**: ya existe un PR de autofix abierto para este PR → ${{ steps.branch.outputs.existing_pr_url }}"

      - name: Configurar Python
        if: steps.branch.outputs.already_exists != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        if: steps.branch.outputs.already_exists != 'true'
        run: |
          pip install --quiet google-genai requests

      - name: Aplicar correcciones con Gemini
        id: autofix
        if: steps.branch.outputs.already_exists != 'true'
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_MODEL:      gemini-2.5-flash
          PR_NUMBER:         ${{ github.event.pull_request.number }}
          PR_HEAD_REF:       ${{ github.event.pull_request.head.ref }}
        run: |
          python .github/scripts/gemini_autofix.py

      - name: Commitear, pushear y crear PR
        if: steps.branch.outputs.already_exists != 'true' && steps.autofix.outputs.has_fixes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "fix: apply gemini review corrections [autofix]"
          git push origin "${{ steps.branch.outputs.name }}"
          gh pr create \
            --title "fix: gemini autofix corrections for PR #${{ github.event.pull_request.number }}" \
            --base "${{ github.event.pull_request.head.ref }}" \
            --head "${{ steps.branch.outputs.name }}" \
            --body-file autofix-pr-body.md \
            --label "gemini:fixes"

      - name: Avisar si no hubo nada que corregir
        if: steps.branch.outputs.already_exists != 'true' && steps.autofix.outputs.has_fixes != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "ℹ️ **Gemini Autofix**: no encontré un review previo con issues 🔴/🟡 aplicables — no hay fix automático para este PR."
