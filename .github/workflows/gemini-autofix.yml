name: Gemini Autofix

on:
  pull_request:
    types: [labeled]

concurrency:
  group: gemini-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gemini-autofix:
    name: AI Autofix
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: github.event.label.name == 'gemini:autofix'

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Crear rama autofix
        id: branch
        run: |
          AUTOFIX_BRANCH="gemini-autofix/${{ github.event.pull_request.head.ref }}"
          git checkout -b "$AUTOFIX_BRANCH"
          git push origin "$AUTOFIX_BRANCH"
          echo "name=$AUTOFIX_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install --quiet google-genai requests

      - name: Aplicar correcciones con Gemini
        id: autofix
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_MODEL:      gemini-2.5-flash
          PR_NUMBER:         ${{ github.event.pull_request.number }}
          PR_HEAD_REF:       ${{ github.event.pull_request.head.ref }}
        run: |
          python .github/scripts/gemini_autofix.py

      - name: Commitear, pushear y crear PR
        if: steps.autofix.outputs.has_fixes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "fix: apply gemini review corrections [autofix]"
          git push origin "${{ steps.branch.outputs.name }}"
          gh pr create \
            --title "fix: gemini autofix corrections for PR #${{ github.event.pull_request.number }}" \
            --base "${{ github.event.pull_request.head.ref }}" \
            --head "${{ steps.branch.outputs.name }}" \
            --body-file autofix-pr-body.md \
            --label "gemini:fixes"

      - name: Avisar si no hubo nada que corregir
        if: steps.autofix.outputs.has_fixes != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "ℹ️ **Gemini Autofix**: no encontré un review previo con issues 🔴/🟡 aplicables — no hay fix automático para este PR."
