name: Gemini Code Review (Extension oficial)

# Prueba en paralelo a gemini-code-review.yml (nuestro prompt a mano). Este usa
# la extension oficial de Google (gemini-cli-extensions/code-review) via MCP,
# no gh crudo — sin shell tools en absoluto, todo pasa por el servidor MCP de
# GitHub en Docker. Label propia (gemini:ext) para poder compararlos en el
# mismo PR sin que se pisen.
on:
  pull_request:
    types: [labeled]

concurrency:
  group: gemini-review-ext-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'gemini:ext'
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Preparar contexto del prompt
        run: |
          mkdir -p .gemini
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg pr "${{ github.event.pull_request.number }}" \
            --arg context "" \
            '{repository: $repo, pull_request_number: $pr, additional_context: $context}' > .gemini/context.json

      - name: Run Gemini Code Review (extension)
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-2.5-flash
          github_pr_number: ${{ github.event.pull_request.number }}
          workflow_name: gemini-code-review-ext
          extensions: |
            [
              "https://github.com/gemini-cli-extensions/code-review"
            ]
          settings: |
            {
              "model": {
                "maxSessionTurns": 25
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_comment_to_pending_review",
                    "pull_request_read",
                    "pull_request_review_write"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": []
              }
            }
          prompt: '/pr-code-review'

      # ── Veredicto (aprobar / pedir cambios) ─────────────────────────────────
      # La extension oficial NUNCA aprueba ni rechaza (su prompt lo prohibe
      # explicitamente, siempre usa evento COMMENT). Decidimos el veredicto
      # nosotros, aparte, contando los comentarios inline que ya posteo por
      # severidad (su propia escala: 🔴 Critical, 🟠 High, 🟡 Medium, 🟢 Low).
      # Esto no depende del modelo - es determinístico, no se puede colgar ni
      # se puede manipular via prompt injection en el diff.
      - name: Decidir aprobar o pedir cambios segun severidad
        if: always() && steps.gemini.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR=${{ github.event.pull_request.number }}

          COMMENTS_JSON=$(gh api "repos/${{ github.repository }}/pulls/$PR/comments" --paginate)

          CRITICAL_COUNT=$(echo "$COMMENTS_JSON" | jq '[.[] | select(.body | startswith("🔴"))] | length')
          HIGH_COUNT=$(echo "$COMMENTS_JSON" | jq '[.[] | select(.body | startswith("🟠"))] | length')

          if [[ "$CRITICAL_COUNT" -gt 0 ]]; then
            gh pr review "$PR" --request-changes --body "⚠️ **Gemini (extension) detectó $CRITICAL_COUNT issue(s) 🔴 crítico(s)** y $HIGH_COUNT de severidad 🟠 alta. Revisá los comentarios inline antes de mergear."
          else
            gh pr review "$PR" --approve --body "✅ **Aprobado automáticamente por Gemini (extension)** — sin issues 🔴 críticos. ($HIGH_COUNT de severidad 🟠 alta a considerar, si los hay.)"
          fi

      # ── Costo real de esta corrida ──────────────────────────────────────────
      - name: Calcular costo real de la transacción
        if: always() && steps.gemini.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_MODEL: gemini-2.5-flash
        run: |
          set -euo pipefail
          STDOUT_LOG="gemini-artifacts/stdout.log"

          if [[ ! -s "$STDOUT_LOG" ]] || ! jq -e '.stats.models' "$STDOUT_LOG" >/dev/null 2>&1; then
            echo "::warning::No se encontró .stats.models en $STDOUT_LOG — no se puede calcular el costo real de esta corrida."
            exit 0
          fi

          MODEL=$(jq -r '.stats.models | keys[0] // empty' "$STDOUT_LOG")
          if [[ -z "$MODEL" ]]; then MODEL="$REQUESTED_MODEL"; fi
          if [[ "$MODEL" != "$REQUESTED_MODEL" ]]; then
            echo "::warning::Se pidio '$REQUESTED_MODEL' pero corrio '$MODEL' - Google lo alias-eo en runtime."
          fi

          case "$MODEL" in
            gemini-2.5-pro)         PRICE_INPUT=1.25; PRICE_OUTPUT=10.00; PRICE_CACHE=0.125 ;;
            gemini-2.5-flash)       PRICE_INPUT=0.30;  PRICE_OUTPUT=2.50;  PRICE_CACHE=0.03  ;;
            gemini-2.5-flash-lite)  PRICE_INPUT=0.10;  PRICE_OUTPUT=0.40;  PRICE_CACHE=0.01  ;;
            gemini-3.5-flash)       PRICE_INPUT=1.50;  PRICE_OUTPUT=9.00;  PRICE_CACHE=0.15  ;;
            gemini-3.5-flash-lite)  PRICE_INPUT=0.30;  PRICE_OUTPUT=2.50;  PRICE_CACHE=0.03  ;;
            *)
              echo "::warning::Modelo '$MODEL' no esta en la tabla de precios local - usando el precio de gemini-2.5-flash como aproximacion."
              PRICE_INPUT=0.30; PRICE_OUTPUT=2.50; PRICE_CACHE=0.03
              ;;
          esac

          mapfile -t TOK < <(jq -r '[.stats.models[].tokens] |
              ( [.[].prompt     // 0] | add // 0 ),
              ( [.[].candidates // 0] | add // 0 ),
              ( [.[].thoughts   // 0] | add // 0 ),
              ( [.[].tool       // 0] | add // 0 ),
              ( [.[].cached     // 0] | add // 0 )' "$STDOUT_LOG")
          PROMPT_TOK=${TOK[0]:-0}
          CANDIDATE_TOK=${TOK[1]:-0}
          THOUGHT_TOK=${TOK[2]:-0}
          TOOL_TOK=${TOK[3]:-0}
          CACHED_TOK=${TOK[4]:-0}

          BILLABLE_INPUT_TOK=$(( PROMPT_TOK - CACHED_TOK ))
          if (( BILLABLE_INPUT_TOK < 0 )); then BILLABLE_INPUT_TOK=0; fi
          OUTPUT_TOK=$(( CANDIDATE_TOK + THOUGHT_TOK + TOOL_TOK ))

          COST=$(awk -v bi="$BILLABLE_INPUT_TOK" -v ct="$CACHED_TOK" -v ot="$OUTPUT_TOK" \
                     -v pi="$PRICE_INPUT" -v pc="$PRICE_CACHE" -v po="$PRICE_OUTPUT" \
                     'BEGIN { printf "%.4f", (bi*pi + ct*pc + ot*po) / 1000000 }')

          MODEL_LABEL="\`$MODEL\`"
          if [[ "$MODEL" != "$REQUESTED_MODEL" ]]; then
            MODEL_LABEL="\`$MODEL\` ⚠️ (se pidió \`$REQUESTED_MODEL\`, Google lo alias-eó en runtime)"
          fi

          BODY="💰 **Costo real de esta transacción Gemini (extension)** ($MODEL_LABEL): **\$$COST USD** — input: ${BILLABLE_INPUT_TOK} tok, cache: ${CACHED_TOK} tok, output: ${OUTPUT_TOK} tok."
          gh pr comment ${{ github.event.pull_request.number }} --body "$BODY"
